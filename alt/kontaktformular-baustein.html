<!--
  Kontaktformular – vorübergehend von der Website entfernt (2026-10-16).
  Wieder einbauen, sobald ein Formular-Dienst (z. B. Formspree oder Netlify Forms) feststeht:
  1. CSS unten in den <style>-Block von index.html kopieren
  2. Formular in den Kontakt-Abschnitt (rechte Spalte) setzen
  3. Script unten ans Ende des Scripts in index.html kopieren und FORM_ZIEL eintragen
-->

<style>
  form { background: var(--schwarz-2); border: 1px solid var(--linie-dunkel); border-radius: 22px; padding: 28px 22px; }
  .feld { margin-bottom: 18px; }
  label { display: block; margin-bottom: 8px; font-size: 0.78rem; font-weight: 500; letter-spacing: 0.12em; text-transform: uppercase; color: var(--leise-dunkel); }
  input, textarea { width: 100%; padding: 14px 16px; font: inherit; font-size: 1rem; color: var(--elfenbein); background: var(--schwarz); border: 1px solid rgba(244, 241, 234, 0.16); border-radius: 12px; transition: border-color 0.2s; }
  input::placeholder, textarea::placeholder { color: rgba(244, 241, 234, 0.35); }
  input:focus, textarea:focus { outline: none; border-color: var(--gold); }
  textarea { min-height: 120px; resize: vertical; }
  form .btn { width: 100%; margin-top: 4px; }
  .form-hinweis { font-size: 0.82rem; color: var(--leise-dunkel); margin-top: 14px; }
  .form-meldung { display: none; margin-top: 16px; padding: 14px 16px; border-radius: 12px; border: 1px solid rgba(212, 175, 106, 0.4); color: var(--elfenbein); font-size: 0.95rem; }
  @media (min-width: 700px) { form { padding: 36px; } }
</style>

<form id="kontaktformular" class="einblenden" novalidate>
  <div class="feld">
    <label for="name">Dein Name</label>
    <input id="name" name="name" type="text" autocomplete="name" required>
  </div>
  <div class="feld">
    <label for="betrieb">Dein Café / Restaurant</label>
    <input id="betrieb" name="betrieb" type="text" autocomplete="organization" required>
  </div>
  <div class="feld">
    <label for="email">Deine E-Mail</label>
    <input id="email" name="email" type="email" autocomplete="email" inputmode="email" required>
  </div>
  <div class="feld">
    <label for="nachricht">Nachricht (optional)</label>
    <textarea id="nachricht" name="nachricht" placeholder="Erzähl mir kurz von deinem Laden."></textarea>
  </div>
  <button type="submit" class="btn">Kostenlose Vorschau anfragen</button>
  <p class="form-hinweis">Mit dem Absenden stimmst du zu, dass ich deine Angaben zur Beantwortung deiner Anfrage nutze. Mehr in der <a href="#datenschutz">Datenschutzerklärung</a>.</p>
  <div class="form-meldung" id="formmeldung" role="status"></div>
</form>

<script>
  // Adresse des Formular-Dienstes, z. B. "https://formspree.io/f/abcdefgh".
  // Leer lassen = Formular öffnet das E-Mail-Programm mit vorausgefüllter Nachricht.
  const FORM_ZIEL = "";
  const EMPFAENGER = "kontakt@jelkdigital.de";

  const formular = document.getElementById("kontaktformular");
  const meldung = document.getElementById("formmeldung");

  function zeigeMeldung(text) {
    meldung.textContent = text;
    meldung.style.display = "block";
  }

  formular.addEventListener("submit", async (e) => {
    e.preventDefault();
    const daten = new FormData(formular);
    const name = daten.get("name").trim();
    const betrieb = daten.get("betrieb").trim();
    const email = daten.get("email").trim();
    const nachricht = daten.get("nachricht").trim();

    if (!name || !betrieb || !/^\S+@\S+\.\S+$/.test(email)) {
      zeigeMeldung("Bitte füll Name, Café/Restaurant und eine gültige E-Mail aus.");
      return;
    }

    if (FORM_ZIEL) {
      try {
        const antwort = await fetch(FORM_ZIEL, { method: "POST", body: daten, headers: { Accept: "application/json" } });
        if (!antwort.ok) throw new Error();
        formular.reset();
        zeigeMeldung("Danke, " + name + "! Deine Anfrage ist angekommen. Ich melde mich bald bei dir.");
      } catch {
        zeigeMeldung("Das hat leider nicht geklappt. Schreib mir gern direkt an " + EMPFAENGER + ".");
      }
      return;
    }

    const betreff = "Anfrage kostenlose Vorschau – " + betrieb;
    const text = "Name: " + name + "\nCafé/Restaurant: " + betrieb + "\nE-Mail: " + email + "\n\n" + nachricht;
    window.location.href = "mailto:" + EMPFAENGER + "?subject=" + encodeURIComponent(betreff) + "&body=" + encodeURIComponent(text);
    zeigeMeldung("Dein E-Mail-Programm öffnet sich gleich. Du musst die Nachricht nur noch abschicken.");
  });
</script>
