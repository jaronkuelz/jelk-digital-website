# Lädt die Website bei jeder Änderung automatisch per FTP in den Ordner jelk/ auf dem Webspace (ohne Passwortschutz).
# Hauptadresse ist jelkdigital.de über GitHub Pages; der Webspace ist nur noch eine Kopie.
# Benötigte GitHub-Secrets: FTP_SERVER, FTP_USERNAME, FTP_PASSWORD
name: Website hochladen

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency: upload

env:
  WEBSITE_URL: http://jelk.kiterunner.net

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 1. .htaccess ohne Passwortschutz erzeugen (ersetzt die alte mit Passwort)
      - name: .htaccess vorbereiten
        run: |
          mkdir -p schutz
          cat > schutz/.htaccess <<HTACCESS
          # Automatisch erzeugt von GitHub (siehe .github/workflows/upload.yml)
          # Immer die JELK-Seite (index.html) als Startseite zeigen, nicht die alte index.htm im Ordner
          DirectoryIndex index.html index.htm
          <FilesMatch "^\.(htpasswd|stand-.*\.json)$">
            Require all denied
          </FilesMatch>
          HTACCESS
          sed -i 's/^          //' schutz/.htaccess
      - name: .htaccess hochladen
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: jelk/
          local-dir: ./schutz/
          state-name: .stand-schutz.json

      # 2. Reste des alten Passwortschutzes vom Server löschen
      - name: Alte Schutz-Dateien löschen
        env:
          SERVER: ${{ secrets.FTP_SERVER }}
          NUTZER: ${{ secrets.FTP_USERNAME }}
          PW: ${{ secrets.FTP_PASSWORD }}
        run: |
          for f in .htpasswd robots.txt .staticrypt.json verschluesseln.mjs; do
            curl -s --user "$NUTZER:$PW" "ftp://$SERVER/" -Q "DELE jelk/$f" -o /dev/null || true
          done

      # 3. Website mit lftp hochladen: eine Datei nach der anderen, bei Abbruch automatisch neu verbinden
      # (der Server blockt zu viele Verbindungen kurz hintereinander). Dateien von Papa im Ordner bleiben unberührt.
      - name: Website hochladen
        env:
          SERVER: ${{ secrets.FTP_SERVER }}
          NUTZER: ${{ secrets.FTP_USERNAME }}
          PW: ${{ secrets.FTP_PASSWORD }}
        run: |
          sudo apt-get install -y -qq lftp > /dev/null
          lftp -u "$NUTZER,$PW" "$SERVER" -e "
            set ftp:ssl-allow no;
            set net:max-retries 8;
            set net:reconnect-interval-base 5;
            set net:reconnect-interval-max 30;
            set net:timeout 30;
            mirror -R --verbose=1 --parallel=1               --exclude-glob .git* --exclude-glob .github/ --exclude-glob alt/               --exclude-glob schutz/ --exclude-glob README.md --exclude-glob CNAME               ./ jelk/;
            quit"

      # 4. Prüfen, dass die Seite ohne Passwort erreichbar ist
      - name: Erreichbarkeit prüfen
        run: |
          for i in 1 2 3 4 5 6; do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' -A "Mozilla/5.0" "$WEBSITE_URL/")
            echo "Versuch $i – Antwort: $CODE"
            [ "$CODE" = "200" ] && exit 0
            [ "$CODE" = "429" ] || break
            sleep 20
          done
          echo "Achtung: Die Seite antwortet nicht mit 200 (Antwort $CODE)!"; exit 1
