# Hilfs-Workflow: zeigt die Ordnernamen auf dem FTP-Server (nur Namen, keine Zugangsdaten)
name: Ordner auf dem Server anzeigen
on: workflow_dispatch
jobs:
  anzeigen:
    runs-on: ubuntu-latest
    steps:
      - name: Ordner auflisten
        env:
          SERVER: ${{ secrets.FTP_SERVER }}
          NUTZER: ${{ secrets.FTP_USERNAME }}
          PW: ${{ secrets.FTP_PASSWORD }}
        run: |
          echo "== Startordner =="; curl -s --list-only --user "$NUTZER:$PW" "ftp://$SERVER/"
          for d in $(curl -s --list-only --user "$NUTZER:$PW" "ftp://$SERVER/" | grep -iv '\.' ); do
            echo "== $d =="; curl -s --list-only --user "$NUTZER:$PW" "ftp://$SERVER/$d/" | head -20
          done
